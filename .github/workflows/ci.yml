name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format .
      - run: git diff --exit-code
      - run: flutter analyze
      - run: flutter test
